<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotesAI - Account Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="account-page">

    <div class="glow glow-1" style="background: var(--primary);"></div>
    <div class="glow glow-2" style="background: var(--secondary); opacity: 0.2"></div>

    <div id="toast" class="toast"></div>

    <div class="auth-layout" style="flex-direction: column;">
        
        <div style="width: 100%; max-width: 450px; display: flex; justify-content: flex-start; margin-bottom: 1.5rem;">
            <a href="dashboard.html" class="nav-ghost" style="display: flex; align-items: center; gap: 8px; font-weight: 600;">⬅ Back to Workspace</a>
        </div>
        
        <div class="auth-card solid-panel slide-up" style="max-width: 450px; padding: 3.5rem;">
            <!-- Read Only Profile -->
            <div id="profile-view">
                <div class="avatar" id="account-avatar" style="width: 120px; height: 120px; font-size: 3.5rem; margin: 0 auto 1.5rem auto; border: 4px solid var(--bg-main)">U</div>
                <h2 id="account-name" style="margin-bottom: 0.25rem; font-size: 2rem;">User Name</h2>
                <p id="account-email" style="margin-bottom: 0.5rem; font-weight: 500; color: var(--text-secondary);">email@domain.com</p>
                <div class="pill-badge" style="margin-bottom: 2.5rem; border-color: var(--primary)">✨ Intelligence Pro</div>

                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <button class="btn btn-primary" onclick="toggleEditProfile()" style="width: 100%;">✏️ Edit Profile Detials</button>
                    <button class="btn btn-outline" onclick="showToast('Password change email sent.', 'success')" style="width: 100%;">🔑 Change Password</button>
                    <button class="btn btn-outline" style="color: var(--danger); border-color: var(--danger); margin-top: 1rem;" onclick="logoutUser()" style="width: 100%;">🚪 Logout Securely</button>
                </div>
            </div>

            <!-- Edit Form -->
            <div id="profile-edit" class="hidden">
                <h2 style="margin-bottom: 2rem; text-align: left;">Edit Profile</h2>
                <form onsubmit="event.preventDefault(); saveProfile();">
                    
                    <div class="input-group" style="text-align: center; margin-bottom: 2rem;">
                        <div class="avatar" style="width: 80px; height: 80px; margin: 0 auto 1rem auto; opacity: 0.5;">U</div>
                        <label>Avatar Upload (Preview only)</label>
                        <input type="file" style="padding: 0.5rem;" accept="image/*" />
                    </div>

                    <div class="input-group">
                        <label>Full Name</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="edit-name" required />
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" id="edit-email" required />
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 1rem; margin-top: 2.5rem;">
                        <button type="button" class="btn btn-outline" onclick="toggleEditProfile()" style="flex: 1;">Cancel</button>
                        <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
